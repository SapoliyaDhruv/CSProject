services:
  - type: web
    name: freshmart-inventory-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: PORT
        value: 5000
      - key: CLIENT_ORIGIN
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
